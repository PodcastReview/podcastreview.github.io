name: Update bp14 record

on:
  push:
    branches:
      - update-record-bp14

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Update record
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path('evidence.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          for rec in data['records']:
              if rec.get('id') == 'bp-14':
                  rec['source'] = "Jan H. Blits, Introduction to Deadly Thought: 'Hamlet' and the Human Soul, pp. 3–21, Lexington Books, 2001 + Folger “A Modern Perspective: Hamlet” 等补充材料"
                  rec['summary'] = "Blits 2001 导论依次讨论：16世纪丹麦处于文艺复兴与宗教改革背景 → Catholic Denmark / purgatory / angels / saints / ghosts → Diet of Worms → Wittenberg → 55行内四次提及 → Luther / 1517 / 95 theses → scholasticism / gravedigger / ghost；随后进入 Saxo → Amleth → Livy / Brutus → Polonius → life / theater / imitation，再到 acting / action、thinking / acting、mind / stage，以及 Renaissance / intellectualism 下 theory / practice、art / life、speech / action、soul / mind 的讨论。节目在对应部分使用这些材料与概念节点。原有 Folger 等材料继续作为补充。"
                  rec['points'] = [
                      {
                          'title': 'Wittenberg 节点',
                          'text': 'Blits：Catholic Denmark → purgatory / angels / saints / ghosts → Diet of Worms → Hamlet 与 Horatio 在 Wittenberg → 55行内四次提及 → Shakespeare 仅点名两所大学之一 → Luther / 1517 / 95 theses → scholasticism → gravedigger / ghost。节目：天主教丹麦 → 炼狱 / 天使 / 圣徒 / 幽灵 → Diet of Worms → Wittenberg → 55行内4次 → 莎士比亚只提两所大学 → Luther / 1517 / 95 theses → 经院哲学 → 掘墓人 / 幽灵。'
                      },
                      {
                          'title': 'Saxo → Amleth → Brutus → Polonius',
                          'text': 'Blits：Hamlet 作为 duplication / imitation → Saxo 的 Amleth → Livy 的 Brutus → Amleth / Brutus 名义 → Polonius 演 Brutus → Hamlet 杀 Polonius → life / theater / imitation。节目：作品作为重复 / 模仿 → Saxo / Amleth → Livy / Brutus → Brutus 词义 → Polonius 演 Brutus → Hamlet 杀 Polonius → 生命 / 戏剧 / 模仿。'
                      },
                      {
                          'title': 'acting / action',
                          'text': 'Blits：“In place of action, Hamlet chooses acting” → stage-acting / action 互换 → middle realm of action 消失 → moral life becomes a self-dramatization。节目：表演变成行动 / 表演代替行动 → act 的“行动 / 扮演”双义 → scenes / 看上去 → 行动领域消失 → 道德生活成为自我戏剧化。'
                      },
                      {
                          'title': 'thinking / acting / mind / stage',
                          'text': 'Blits：thinks without acting / acts without thinking → action 与 theater 互换 → both refuges lie in the mind → one eye inward / one upon the stage → misses the moral life that lies between。节目：思想与行动分开 → 内在世界与舞台行动分裂 → 两个避难所都在心智 → 一只眼向内、另一只眼看舞台 → 中间的道德生活消失。'
                      },
                      {
                          'title': 'Renaissance / intellectualism',
                          'text': 'Blits：Renaissance → Rome → Greece → imitation of an imitation → rhetorical / poetic imitation，而非 political / military deeds → Machiavelli；后文继续讨论 theory / practice、art / life、stage-acting / action、speech / action、soul / mind。节目：文艺复兴 → 希腊 / 罗马 / imitation → 修辞与诗歌 / 政治军事行动 → Machiavelli；后段继续讨论理论 / 实践、艺术 / 生活、表演 / 行动、语言 / 行动、灵魂 / 心智。'
                      }
                  ]
                  rec['urls'] = []
                  rec['urlLabels'] = []
                  break
          else:
              raise SystemExit('bp-14 not found')

          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence.json
          git diff --cached --quiet && exit 0
          git commit -m "Update record bp-14"
          git push origin HEAD:main
      - name: Remove temporary branch
        if: always()
        run: git push origin --delete update-record-bp14 || true
